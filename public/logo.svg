<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none" width="100%" height="100%">
  <!-- Deep Teal Ink Palette from Photograph -->
  <g fill="#244B47" stroke="#244B47">
    
    <!-- Circular Palm & Waves Emblem (Left) -->
    <g transform="translate(6, 6)">
      <!-- Outer Circle Ring -->
      <circle cx="39" cy="39" r="36" stroke="#244B47" stroke-width="2.6" fill="none"/>
      
      <!-- Palm Tree -->
      <!-- Trunk -->
      <path d="M40 50 C 40.5 40, 39 34, 34 26 C 36 26, 38.5 34, 42.5 50 Z" fill="#244B47" stroke="none"/>
      
      <!-- Palm Fronds (Natural hand-drawn feel) -->
      <!-- Left fronds -->
      <path d="M34 26 C 28 24, 20 27, 16 33 C 21 34, 28 31, 34 26 Z" fill="#244B47" stroke="none"/>
      <path d="M34 26 C 26 21, 20 15, 17 18 C 21 21, 27 23, 34 26 Z" fill="#244B47" stroke="none"/>
      <path d="M34 26 C 31 18, 33 13, 36 14 C 36 19, 35 23, 34 26 Z" fill="#244B47" stroke="none"/>
      
      <!-- Right fronds -->
      <path d="M34 26 C 41 18, 48 18, 51 22 C 46 24, 40 25, 34 26 Z" fill="#244B47" stroke="none"/>
      <path d="M34 26 C 44 24, 52 28, 54 34 C 48 33, 42 30, 34 26 Z" fill="#244B47" stroke="none"/>
      <path d="M34 26 C 41 29, 47 37, 45 42 C 42 38, 38 33, 34 26 Z" fill="#244B47" stroke="none"/>
      
      <!-- Flowing Ocean Waves at base of circle -->
      <path d="M6 48 C 16 46, 26 53, 38 52 C 50 51, 60 55, 71 52" stroke="#244B47" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M9 56 C 20 53, 30 61, 44 58 C 55 55, 63 60, 69 58" stroke="#244B47" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M15 64 C 24 61, 33 66, 45 64 C 54 62, 59 66, 63 64" stroke="#244B47" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Wordmark "ExploreX" -->
    <g transform="translate(94, 20)">
      <!-- "Explore" in crisp geometric sans -->
      <text x="0" y="36" font-family="'Figtree', 'Montserrat', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#244B47" stroke="none" letter-spacing="-0.5">Explore</text>
      
      <!-- Custom Calligraphic 'X' with flared swoosh -->
      <g transform="translate(142, 6)">
        <!-- Backslash stroke -->
        <path d="M4 6 C 7 10, 15 22, 23 30 C 26 33, 30 34, 34 32 C 30 33, 22 28, 17 21 C 12 14, 5 7, 2 5 Z" fill="#244B47" stroke="none"/>
        <!-- Forward slash stroke with sweeping flared swoosh (matching the photo) -->
        <path d="M22 6 C 24 8, 27 6, 32 3 C 27 6, 23 11, 15 21 C 9 29, 4 33, 0 35 C 5 33, 11 28, 18 19 C 24 11, 28 6, 31 3" stroke="#244B47" stroke-width="4.2" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Tagline: "TRAVEL AGENCY" -->
      <text x="2" y="58" font-family="'Figtree', 'Montserrat', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#244B47" stroke="none" letter-spacing="4.5">TRAVEL AGENCY</text>
    </g>
  </g>
</svg>
